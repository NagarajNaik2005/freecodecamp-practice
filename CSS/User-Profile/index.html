<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Account</title>
<link rel="stylesheet" href="profile.css">
</head>
<body>

<header class="navbar">
    <h1>MyShop</h1>
    <p>My Account</p>
</header>

<div class="container">

    <div class="profile-card">
        <img src="https://via.placeholder.com/120" alt="profile">
        <h2>John Doe</h2>
        <p>johndoe@email.com</p>
        <button>Edit Profile</button>
    </div>

    <div class="account-details">
        <h2>Account Details</h2>

        <div class="detail">
            <span>Full Name</span>
            <strong>John Doe</strong>
        </div>

        <div class="detail">
            <span>Email</span>
            <strong>johndoe@email.com</strong>
        </div>

        <div class="detail">
            <span>Phone</span>
            <strong>+91 9876543210</strong>
        </div>

        <div class="detail">
            <span>Address</span>
            <strong>Bangalore, India</strong>
        </div>
    </div>

    <div class="orders">
        <h2>Recent Orders</h2>

        <div class="order">
            <span>Order #12453</span>
            <span>₹2,499</span>
            <span>Delivered</span>
        </div>

        <div class="order">
            <span>Order #12460</span>
            <span>₹3,199</span>
            <span>Shipped</span>
        </div>

        <div class="order">
            <span>Order #12470</span>
            <span>₹1,299</span>
            <span>Processing</span>
        </div>
    </div>

</div>

</body>
</html>
